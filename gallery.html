<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギャラリー | 木と石のあいだ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood-dark:#3b2616;
  --wood:#7a4e2d;
  --wood-light:#b98a5e;
  --stone-dark:#4a4d50;
  --stone:#8c9093;
  --stone-light:#d6d7d5;
  --paper:#efeeeb;
  --ink:#2a2420;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.9;font-size:16px}
a{color:inherit}
a:focus-visible{outline:3px solid var(--wood-light);outline-offset:3px}

header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 24px;padding:14px 5vw;background:linear-gradient(90deg,var(--wood-dark) 0%,var(--wood-dark) 50%,var(--stone-dark) 50%,var(--stone-dark) 100%);color:var(--paper)}
.logo{font-family:var(--serif);font-weight:800;font-size:1.25rem;text-decoration:none;letter-spacing:.08em}
nav ul{display:flex;gap:6px;list-style:none;flex-wrap:wrap}
nav a{display:block;padding:6px 16px;text-decoration:none;font-weight:500;border-radius:2px}
nav a:hover,nav a[aria-current="page"]{background:var(--paper);color:var(--wood-dark)}

.page-title{position:relative;padding:48px 5vw;color:var(--paper);overflow:hidden}
.page-title::before,.page-title::after{content:"";position:absolute;inset:0}
.page-title::before{
  background:repeating-linear-gradient(98deg,var(--wood) 0 7px,#6b4226 7px 11px,var(--wood) 11px 22px,#855635 22px 25px,var(--wood) 25px 41px,#5e3a20 41px 43px);
  clip-path:polygon(0 0,60% 0,50% 100%,0 100%);
}
.page-title::after{background:linear-gradient(135deg,var(--stone),var(--stone-dark));clip-path:polygon(60% 0,100% 0,100% 100%,50% 100%)}
.page-title h1{position:relative;z-index:1;font-family:var(--serif);font-weight:800;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.12em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.page-title p{position:relative;z-index:1;text-shadow:0 1px 0 rgba(0,0,0,.4)}

main{max-width:1040px;margin:0 auto;padding:24px 5vw 72px}
section{padding-top:48px}
h2{font-family:var(--serif);font-weight:700;font-size:1.6rem;margin-bottom:6px;padding-left:16px;border-left:8px solid var(--wood);position:relative}
h2::after{content:"";position:absolute;left:-8px;bottom:0;width:8px;height:50%;background:var(--stone)}
.note{margin:0 0 24px 24px;font-size:.92rem;color:var(--stone-dark)}

/* 作品の台座：木の額と石の額を交互に */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
figure{background:#fbfbf9;padding:12px;border:6px solid var(--wood);border-radius:3px;box-shadow:0 4px 0 var(--wood-dark)}
figure:nth-child(even){border-color:var(--stone);box-shadow:0 4px 0 var(--stone-dark)}
.thumb{aspect-ratio:3/4;display:grid;place-items:center;background:var(--stone-light);color:var(--stone-dark);font-size:.85rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{margin-top:10px;font-family:var(--serif);font-weight:700;line-height:1.5}
figcaption small{display:block;font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--stone-dark)}
.illust .thumb{aspect-ratio:1/1}

footer{background:var(--wood-dark);color:var(--stone-light);text-align:center;padding:28px 5vw;font-size:.85rem;border-top:6px solid var(--stone)}

@media (max-width:640px){
  header{background:var(--wood-dark)}
  .grid{grid-template-columns:repeat(2,1fr);gap:16px}
  figure{padding:8px;border-width:5px}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">木と石のあいだ</a>
  <nav aria-label="メイン">
    <ul>
      <li><a href="index.html">トップ</a></li>
      <li><a href="blog.html">ブログ</a></li>
      <li><a href="gallery.html" aria-current="page">ギャラリー</a></li>
      <li><a href="about.html">このサイトについて</a></li>
    </ul>
  </nav>
</header>

<div class="page-title">
  <h1>ギャラリー</h1>
  <p>漫画とイラストの作品を並べています。</p>
</div>

<main>
  <section id="manga">
    <h2>漫画</h2>
    <p class="note">表紙や1ページ目を載せています。</p>
    <div class="grid">
      <!-- 画像を入れるときは、下の thumb の中身を <img src="画像のファイル名" alt="作品の説明"> に差し替えてください -->
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.10</small></figcaption></figure>
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.09</small></figcaption></figure>
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.08</small></figcaption></figure>
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.07</small></figcaption></figure>
    </div>
  </section>

  <section id="illust" class="illust">
    <h2>イラスト</h2>
    <p class="note">彫刻をテーマにしたものや、日々の落書きなど。</p>
    <div class="grid">
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.10</small></figcaption></figure>
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.10</small></figcaption></figure>
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.09</small></figcaption></figure>
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.09</small></figcaption></figure>
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.08</small></figcaption></figure>
      <figure><div class="thumb">画像を入れる</div><figcaption>作品タイトル<small>2026.08</small></figcaption></figure>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2026 木と石のあいだ</p>
</footer>

</body>
</html>
